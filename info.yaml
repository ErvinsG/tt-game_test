# Tiny Tapeout project information
project:
  title:        "Grid chase"
  author:       "Erviins"
  discord:      ""
  description:  "20x20 grid in fog: chase a runaway square around red blockers, spend coins to widen your view (3x3, 5x5, 7x7), then buy the trophy to win"
  language:     "Verilog"
  clock_hz:     25175000
  tiles: "1x2"
  top_module:  "tt_um_ervinsg_game_test"
  source_files:
    - "game_core.v"
    - "ip_gamepad.v"
    - "ip_buttons.v"
    - "project.v"
    - "vga_shell.v"

pinout:
  ui[0]: "Left"
  ui[1]: "Right"
  ui[2]: "Up"
  ui[3]: "Down"
  ui[4]: "Gamepad Pmod latch (optional)"
  ui[5]: "Gamepad Pmod clock (optional)"
  ui[6]: "Gamepad Pmod data (optional)"
  ui[7]: "Buy bigger fog window (4 catches)"
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VGA vsync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "VGA hsync"
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

